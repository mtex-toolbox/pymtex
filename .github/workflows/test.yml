# the test suite in two tiers, since a private repository pays macOS minutes tenfold and
# Windows twofold: every push and pull request runs one Linux job; a release tag or a manual
# run adds the other Pythons, Windows, one macOS job, the NumPy fallback and the distributions
name: tests

on:
  # the pages, the benchmarks and the notes leave the tests alone, but for the function
  # reference, which tests/test_reference.py checks
  push:
    branches: [main]
    paths: ["**", "!docs/**", "docs/reference.py", "docs/reference-matlab.txt", "!bench/**", "!tools/graph/**", "!**.md", "!**.ipynb"]
  pull_request:
    paths: ["**", "!docs/**", "docs/reference.py", "docs/reference-matlab.txt", "!bench/**", "!tools/graph/**", "!**.md", "!**.ipynb"]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: ubuntu-latest / Python 3.14 / numba,io,plot
    if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: install
        run: python -m pip install ".[numba,io,plot]" pytest
      - name: test
        run: python -m pytest -q

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.extras }}
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.12", extras: "numba,io,plot"}
          - {os: ubuntu-latest, python: "3.13", extras: "numba,io,plot"}
          - {os: ubuntu-latest, python: "3.14", extras: "numba,io,plot"}
          - {os: ubuntu-latest, python: "3.14", extras: "io,plot"}
          - {os: windows-latest, python: "3.12", extras: "numba,io,plot"}
          - {os: windows-latest, python: "3.14", extras: "numba,io,plot"}
          - {os: macos-latest, python: "3.14", extras: "numba,io,plot"}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: install
        run: python -m pip install ".[${{ matrix.extras }}]" pytest
      - name: test
        run: python -m pytest -q

  build:
    name: distributions
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv build
      - name: fresh wheel and source installs outside the checkout
        run: python tools/check_dist.py --dist dist --python 3.12
