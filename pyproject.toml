[project]
name = "mtex"
version = "1.0.0"
description = "MTEX, the crystallographic texture analysis toolbox, in Python"
readme = "README.md"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Ralf Hielscher" }]
keywords = ["texture", "crystallography", "EBSD", "orientation", "ODF", "pole figure", "materials science"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.12"
dependencies = [
    "finufft>=2.5.1",
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
numba = ["numba>=0.61"]
io = ["h5py>=3"]
plot = ["matplotlib>=3.8"]
wizard = [
    "pyside6>=6.11.2",
    "matplotlib>=3.8",
]
plot3d = [
    "pyvista>=0.49.0",
]
all = ["mtex[numba,io,plot,wizard,plot3d]"]

[project.gui-scripts]
mtex-wizard = "mtex.wizard.__main__:main"

[project.urls]
Homepage = "https://mtex-toolbox.github.io"
Documentation = "https://mtex-toolbox.github.io/documentation.html"
Source = "https://github.com/mtex-toolbox/pymtex"
Issues = "https://github.com/mtex-toolbox/pymtex/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "numba>=0.61",
    "h5py>=3",
    "matplotlib>=3.8",
    "jupytext>=1.19.5",
    "ipykernel>=7.3.0",
    "pyside6>=6.11.2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mtex"]

# the documentation pages, which openDoc writes out as cell scripts (hatch_build.py)
[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist]
include = ["mtex", "tests", "tools/staticapi.py", "tools/syntaxcheck.py", "docs/pages/*/*.py", "docs/reference.py", "docs/reference-matlab.txt", "hatch_build.py", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# a test running longer than this is taken for hung: the stacks of every thread are written to
# the terminal and the run ends with a failure, instead of waiting on a thread blocked in C
faulthandler_timeout = 300
faulthandler_exit_on_timeout = true
