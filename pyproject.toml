[project]
name = "mtex"
version = "0.0.1"
description = "MTEX, the crystallographic texture analysis toolbox, in Python"
requires-python = ">=3.11"
dependencies = [
    "finufft>=2.5.1",
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
numba = ["numba>=0.61"]
io = ["h5py>=3"]
plot = ["matplotlib>=3.8"]
wizard = [
    "pyside6>=6.11.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "orix",
    "numba>=0.61",
    "h5py>=3",
    "matplotlib>=3.8",
    "jupytext>=1.19.5",
    "ipykernel>=7.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mtex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
